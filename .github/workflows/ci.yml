name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev,usd]"
      - run: python -c "from pxr import Usd; assert Usd.GetVersion() == (0, 26, 5), Usd.GetVersion(); print(Usd.GetVersion())"
      - run: make ci-check
