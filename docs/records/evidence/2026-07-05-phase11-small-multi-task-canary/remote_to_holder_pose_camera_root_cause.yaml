root_cause_summary: >-
  The remote-to-holder WARN was not only a camera-framing issue. Scenario Forge's
  first example manifest had already corrected the remote orientation to match
  GenManip's wxyz convention, but kept a static z center of 0.11 m. With the
  corrected orientation, that placed the remote bottom about 9.6 cm above the
  task5 table top, making the object appear to float in the retained render.
