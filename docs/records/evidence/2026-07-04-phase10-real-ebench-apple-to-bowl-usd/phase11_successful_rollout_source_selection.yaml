package_linkage_assessment:
  historical_source_is_package_linked: false
  historical_source_status: reference_only
  reason: BPL-19R.R2 consumed the native GenManip task config directly and did not load the Scenario Forge package descriptor, task contract, scene USD, or asset lock.
  phase_11_3c_wrapper_status: multi_attempt_dry_run_package_linkage_verified
  phase_11_3c_plan_evidence: /cpfs/user/zhuzihou/dev/scenario-forge/docs/records/evidence/2026-07-04-phase10-real-ebench-apple-to-bowl-usd/phase11_3c_bpl19r_package_linked_plan/phase11_package_linked_bpl19r_rerun.yaml
  phase_11_3c_planned_attempt_count: 10
  phase_11_3c_live_rerun_status: pending
  required_for_phase_11_3c:
    - EOS loads the Scenario Forge package descriptor from /tmp/ebench-apple-to-bowl-canary/adapters/ebench/package.yaml.
    - EOS records package_id, task_id, task_contract path, scene_usd path, asset_lock path, and adapter descriptor path in the run evidence.
    - EOS maps mobile_manip/apple_to_fruit_bowl to the native GenManip apple_to_fruit_bowl.yml config with the mapping source recorded.
    - EOS launches the BPL-19R online policy lane with a package-scoped run_id.
    - EOS permits repeated package-scoped attempts because the current BPL-19R CLI cannot target or replay the retained successful attempt 007 seed directly.
    - EOS translates BPL-19R native run reports into Phase 11 completed-episode and success-predicate evidence if the native trace format is not directly consumable by the existing Phase 11 CLI.
    - EOS retains terminal episode_result, trace, runtime log, initial/final keyframes, and simulator-state projection for the new package-linked run.
    - Scenario Forge ingests the new executed-episode evidence and strict predicate evidence; historical BPL-19R result_info files are not used as the final predicate pass.
