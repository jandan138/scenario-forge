  - The worker pool rebuilt task state before final save, then finalized and wrote both result files normally.
  - Four structured worker-log ERROR records are tqdm progress bars routed through stderr, not failed operations.
  - Current EOS still emits legacy task_id, external_task_id, and scenario_pack labels; the native episode ID and frozen hashes establish package linkage.
  - The terminal GenManip envelope has obs=null, so no post-step robot stability claim is possible.
  - The one-step neutral action does not exercise cuRobo IK, motion generation, or collision avoidance.

