[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-forge"
version = "0.1.0"
description = "Generate evaluation-ready scenario packages for embodied agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Scenario Forge Contributors"}
]
dependencies = [
  "pyyaml>=6.0",
  "typing-extensions>=4.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "jsonschema>=4.18",
  "ruff>=0.5",
  "mypy>=1.8",
]

[project.scripts]
scenario-forge = "scenario_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scenario_forge = ["schemas/jsonschema/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
