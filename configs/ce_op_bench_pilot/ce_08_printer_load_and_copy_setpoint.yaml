layout_request:
  schema_version: relational-layout-spec/v0.1
  seed: 303
  table:
    x_range_m: [-1.0, 1.0]
    y_range_m: [-0.40, 0.40]
    surface_z_m: 0.755
    min_edge_clearance_m: 0.015
  robot_xy: [0.0, -0.70]
  objects:
    - id: brother_printer
      role: articulated_appliance
      footprint_xy_m: [0.412, 0.399]
      region: center
      facing: robot
      fixed_xy_m: [0.0, -0.015]
      robot_side_exception: "Fixed-base placement of Brother MFC-L2820DW keeping front paper cassette, scanner platen, ADF scanner lid, and angled START button simultaneously reachable."
      kinematic_clearance_volumes:
        - id: paper_cassette_pullout
          joint: paper_cassette
