        group_id: rear_kitchen_utility
        metric_participation: none
  robot:
    profile_ref: manip/lift2/R5a_isaac41_vr600_v1
    spawn:
      xyz: [0.0, -0.76, 0.31]
      wxyz: [0.7071067812, 0.0, 0.0, 0.7071067812]
    actors:
      - id: left_arm
        end_effector: left
        capabilities: [grasp, pull, lift, place, release]
      - id: right_arm
        end_effector: right
        capabilities: [grasp, push, insert, close, rotate, press, release]
  steps:
    - id: press_power_wake
      skill: push
      actors: [right_arm]
      parameters:
        object: espresso_center
        joint: button_drink
        target_state: pressed
    - id: extend_drip_tray
      skill: open_articulated_part
      actors: [left_arm]
      depends_on: [press_power_wake]
      parameters:
        object: espresso_center
        joint: drip_tray
        target_state: extended
    - id: place_espresso_cup
      skill: place
      actors: [left_arm]
      depends_on: [extend_drip_tray]
      parameters:
        object: espresso_cup
        target: espresso_center
        target_frame: espresso_center.cup_spout_target
    - id: drop_coffee_capsule
      skill: insert
      actors: [right_arm]
      depends_on: [place_espresso_cup]
      parameters:
        object: coffee_capsule
        target: espresso_center
        target_frame: espresso_center.capsule_chute
    - id: close_brew_lever
      skill: close_articulated_part
      actors: [right_arm]
      depends_on: [drop_coffee_capsule]
      parameters:
        object: espresso_center
        joint: brew_lever
        target_state: closed_locked
    - id: turn_select_dial
      skill: adjust_articulated_part
      actors: [right_arm]
      depends_on: [close_brew_lever]
      parameters:
        object: espresso_center
        joint: select_dial
        target_state: espresso_selected
    - id: press_dial_confirm
      skill: adjust_articulated_part
      actors: [right_arm]
      depends_on: [turn_select_dial]
      parameters:
        object: espresso_center
        joint: dial_press
        target_state: pressed
  invariants: []
  success:
