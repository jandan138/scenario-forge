task_draft:
  schema_version: out-of-domain-task-draft/v0.1
  target_schema_version: scenario-spec/v0.6
  scenario_id: ce_01_home_espresso_brew_v2
  domain: ce_op_home_v2
  task_family: multi_dof_home_appliance_operation
  instruction: "Press the espresso machine power key to wake the OLED screen, pull out the stainless drip tray, weave past the kitchen clutter to place the espresso cup under the spout, load the aluminum capsule into the chute, close the brew lever interlock, rotate the selector dial clockwise to the Espresso setting, and press the center dial button to extract coffee while leaving all surrounding kitchenware undisturbed."
  max_steps: 2600
  seed: "201"
  scene:
    asset_id: home_warm_kitchen_island_v2
    root_prim_path: /World
    pose:
      xyz: [0.0, 0.0, 0.0]
      wxyz: [1.0, 0.0, 0.0, 0.0]
