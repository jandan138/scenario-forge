schema_version: out-of-domain-task-bundle/v0.1
domain_pack: configs/domain_packs/specialty_coffee_bar/layout_constraints.yaml
source_bindings: configs/source_bindings/out_of_domain_hero_r2_20261113.yaml

layout_request:
  schema_version: relational-layout-spec/v0.1
  seed: 101
  table:
    x_range_m: [-1.0, 1.0]
    y_range_m: [-0.40, 0.40]
    surface_z_m: 0.755
    min_edge_clearance_m: 0.10
  robot_xy: [0.0, -1.02]
  objects:
    - id: creatista_machine
      role: articulated_appliance
      footprint_xy_m: [0.175, 0.395]
      region: center
      facing: robot
      fixed_xy_m: [0.0, -0.020]
      robot_side_exception: "393mm deep Breville/Nespresso BNE800 body spans table centerline to maintain >=132mm front drip-tray pullout margin."
      kinematic_clearance_volumes:
        - id: drip_tray_pullout
          joint: drip_tray
          local_xy_bounds_m:
            x: [-0.090, 0.090]
            y: [-0.248, -0.197]
    - id: espresso_cup
      role: target_container
      footprint_xy_m: [0.080, 0.066]
      region: left
      facing: robot
      support_z_offset_m: 0.002
    - id: coffee_capsule
      role: consumable_capsule
      footprint_xy_m: [0.042, 0.042]
      region: right
      facing: robot
      support_z_offset_m: 0.002
    - id: milk_pitcher
      role: context_prop
      footprint_xy_m: [0.092, 0.120]
      region: far_context
      facing: robot
      support_z_offset_m: 0.002
  relations:
    - subject: espresso_cup
      predicate: left_of
      reference: creatista_machine
    - subject: coffee_capsule
      predicate: right_of
      reference: creatista_machine
    - subject: milk_pitcher
      predicate: right_of
      reference: creatista_machine

task_draft:
  schema_version: out-of-domain-task-draft/v0.1
  target_schema_version: scenario-spec/v0.6
  scenario_id: specialty_coffee_bar_creatista_prep
  domain: specialty_coffee_bar
  task_family: multi_dof_appliance_operation
  instruction: "拉出咖啡机底部穿孔不锈钢接水托杯盘，将白瓷浓缩咖啡杯正立放置在伸出后的托杯盘上；随后将铝制咖啡胶囊投入顶部敞开的胶囊投料槽内，压下顶部镀铬 U 型冲煮压杆完成闭锁，再将前面板滚花复合编码旋钮顺时针旋至意式浓缩档位，最后下压该复合旋钮完成萃取确认。"
  max_steps: 2600
  seed: "101"
  scene:
    asset_id: out_of_domain_env_kitchen_coffee_bar_v1
    root_prim_path: /World
    pose:
      xyz: [0.0, 0.0, 0.0]
      wxyz: [1.0, 0.0, 0.0, 0.0]
  table:
    id: table
    asset_id: standard_table
    source_prim_path: /World/table
    pose:
      xyz: [0.0, 0.0, 0.0]
      wxyz: [1.0, 0.0, 0.0, 0.0]
  object_bindings:
    creatista_machine:
      asset_id: NespressoCreatistaPlus
      source_prim_path: /World/NespressoCreatistaPlus
      role: articulated_appliance
      metadata:
        articulated_pose_frame: support_plane
      named_frames:
        support:
          xyz: [0.0, 0.0, 0.0]
          wxyz: [1.0, 0.0, 0.0, 0.0]
        capsule_chute:
          xyz: [0.0, -0.105, 0.252]
          wxyz: [1.0, 0.0, 0.0, 0.0]
        cup_spout_target:
          xyz: [0.0, -0.192, 0.036]
          wxyz: [1.0, 0.0, 0.0, 0.0]
    espresso_cup:
      asset_id: EspressoCup
      source_prim_path: /World/EspressoCup
      role: target_container
    coffee_capsule:
      asset_id: CoffeeCapsule
      source_prim_path: /World/CoffeeCapsule
      role: consumable_capsule
    milk_pitcher:
      asset_id: MilkPitcher
      source_prim_path: /root
      role: context_prop
      metadata:
        dressing_preset_id: specialty_coffee_bar_standard_v1
        group_id: milk_steaming_station
        metric_participation: none
  robot:
    profile_ref: manip/lift2/R5a_isaac41_vr600_v1
    spawn:
      xyz: [0.0, -1.02, 0.31]
      wxyz: [0.7071067812, 0.0, 0.0, 0.7071067812]
    actors:
      - id: left_arm
        end_effector: left
        capabilities: [grasp, pull, lift, place, release]
      - id: right_arm
        end_effector: right
        capabilities: [grasp, insert, close, rotate, press, release]
  steps:
    - id: extend_drip_tray
      skill: open_articulated_part
      actors: [left_arm]
      parameters:
        object: creatista_machine
        joint: drip_tray
        target_state: extended
    - id: place_espresso_cup
      skill: place
      actors: [left_arm]
      depends_on: [extend_drip_tray]
      parameters:
        object: espresso_cup
        target: creatista_machine
        target_frame: creatista_machine.cup_spout_target
    - id: drop_coffee_capsule
      skill: insert
      actors: [right_arm]
      depends_on: [place_espresso_cup]
      parameters:
        object: coffee_capsule
        target: creatista_machine
        target_frame: creatista_machine.capsule_chute
    - id: close_brew_lever
      skill: close_articulated_part
      actors: [right_arm]
      depends_on: [drop_coffee_capsule]
      parameters:
        object: creatista_machine
        joint: brew_lever
        target_state: closed_locked
    - id: turn_select_dial
      skill: adjust_articulated_part
      actors: [right_arm]
      depends_on: [close_brew_lever]
      parameters:
        object: creatista_machine
        joint: select_dial
        target_state: espresso_selected
    - id: press_dial_confirm
      skill: adjust_articulated_part
      actors: [right_arm]
      depends_on: [turn_select_dial]
      parameters:
        object: creatista_machine
        joint: dial_press
        target_state: pressed
  invariants: []
  success:
    operator: all
    claim_scope: "Out-of-domain 6-stage CAD coffee preparation contract (r2); validates multi-DOF joint state progression including serial rotary+push encoder confirmation and non-convex capsule/cup placement geometry without claiming autonomous policy execution."
    predicates:
      - id: drip_tray_extended
        type: articulation_joint_state_reached
        sequence_index: 0
        parameters:
          object: creatista_machine
          joint: drip_tray
          state: extended
      - id: cup_placed_on_drip_tray
        type: relative_pose_reached
        sequence_index: 1
        parameters:
          object: espresso_cup
          relative_to: creatista_machine
          xyz_range:
            x: [-0.025, 0.025]
            y: [-0.215, -0.168]
            z: [0.030, 0.048]
          axis_alignment:
            relative_to_part: drip_tray
            object_axis: z
            target_axis: z
            comparison: "<="
            threshold_deg: 12.0
      - id: capsule_loaded_in_chute
        type: relative_pose_reached
        sequence_index: 2
        parameters:
          object: coffee_capsule
          relative_to: creatista_machine
          xyz_range:
            x: [-0.015, 0.015]
            y: [-0.116, -0.084]
            z: [0.246, 0.268]
          axis_alignment:
            relative_to_part: drip_tray
            object_axis: z
            target_axis: z
            comparison: "<="
            threshold_deg: 25.0
      - id: brew_lever_closed_locked
        type: articulation_joint_state_reached
        sequence_index: 3
        parameters:
          object: creatista_machine
          joint: brew_lever
          state: closed_locked
      - id: select_dial_espresso
        type: articulation_joint_state_reached
        sequence_index: 4
        parameters:
          object: creatista_machine
          joint: select_dial
          state: espresso_selected
      - id: dial_press_confirmed
        type: articulation_joint_state_reached
        sequence_index: 5
        parameters:
          object: creatista_machine
          joint: dial_press
          state: pressed
    progress_rubric:
      aggregation:
        type: weighted_progress_score
        normalization: declared_sum
        inactive_treatment: zero
      items:
        - id: stage0_tray_extended
          weight: 0.16
          active: true
          temporal:
            kind: instant
          condition:
            type: articulation_joint_state_reached
            parameters:
              object: creatista_machine
              joint: drip_tray
              state: extended
          source_ref:
            step_id: extend_drip_tray
        - id: stage1_cup_seated
          weight: 0.18
          active: true
          requires: [stage0_tray_extended]
          temporal:
            kind: instant
          condition:
            type: relative_pose_reached
            parameters:
              object: espresso_cup
              relative_to: creatista_machine
              xyz_range:
                x: [-0.025, 0.025]
                y: [-0.215, -0.168]
                z: [0.030, 0.048]
          source_ref:
            step_id: place_espresso_cup
        - id: stage2_capsule_inserted
          weight: 0.20
          active: true
          requires: [stage1_cup_seated]
          temporal:
            kind: instant
          condition:
            type: relative_pose_reached
            parameters:
              object: coffee_capsule
              relative_to: creatista_machine
              xyz_range:
                x: [-0.015, 0.015]
                y: [-0.116, -0.084]
                z: [0.246, 0.268]
          source_ref:
            step_id: drop_coffee_capsule
        - id: stage3_lever_locked
          weight: 0.18
          active: true
          requires: [stage2_capsule_inserted]
          temporal:
            kind: instant
          condition:
            type: articulation_joint_state_reached
            parameters:
              object: creatista_machine
              joint: brew_lever
              state: closed_locked
          source_ref:
            step_id: close_brew_lever
        - id: stage4_dial_selected
          weight: 0.14
          active: true
          requires: [stage3_lever_locked]
          temporal:
            kind: instant
          condition:
            type: articulation_joint_state_reached
            parameters:
              object: creatista_machine
              joint: select_dial
              state: espresso_selected
          source_ref:
            step_id: turn_select_dial
        - id: stage5_dial_pressed
          weight: 0.14
          active: true
          requires: [stage4_dial_selected]
          temporal:
            kind: terminal
          condition:
            type: articulation_joint_state_reached
            parameters:
              object: creatista_machine
              joint: dial_press
              state: pressed
          source_ref:
            step_id: press_dial_confirm
