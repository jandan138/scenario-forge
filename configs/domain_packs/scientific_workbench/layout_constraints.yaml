schema_version: layout-constraints/v0.2
workspace:
  x_range_m: [0.35, 0.75]
  y_range_m: [-0.35, 0.35]
  z_m: 0.92
tabletop_placement:
  policy_id: scientific_workbench.robot_facing_tabletop.v1
  # The policy evaluates composed-world bounds. The robot-facing half is
  # derived from the table centre toward the declared robot base, not this
  # source coordinate frame.
  support_surface_prim_path: /World/table/surface
  min_edge_clearance_m: 0.10
  support_height_tolerance_m: 0.02
  exception_metadata_key: tabletop_placement_exception
difficulty_profiles:
  easy:
    clutter_level: low
    target_distance_range_m: [0.15, 0.25]
    occlusion: none
    distractor_count: 0
  medium:
    clutter_level: medium
    target_distance_range_m: [0.25, 0.45]
    occlusion: partial
    distractor_count: 2
  hard:
    clutter_level: high
    target_distance_range_m: [0.35, 0.65]
    occlusion: partial
    distractor_count: 5
