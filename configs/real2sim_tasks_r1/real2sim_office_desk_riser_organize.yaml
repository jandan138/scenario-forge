  task_family: desktop_drawer_storage_and_beverage_organization
  instruction: "握持桌面中央白色双抽屉显示器增高架右侧圆环拉手向外拉出右侧抽屉（>=12 cm），依次拾取右侧桌面上的好丽友派独立包装袋与蓝色圆珠笔平稳放入右侧抽屉收纳腔内，随后将右侧抽屉推回闭合到位，最后拾取右前方带把玻璃水杯竖直摆放到右侧雪碧瓶旁的饮品杯垫目标区。"
  max_steps: 2600
  seed: "401"
  scene:
