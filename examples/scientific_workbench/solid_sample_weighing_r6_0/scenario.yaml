  actors:
    - {id: auxiliary_arm, end_effector: right, capabilities: [press, grasp, hold, release]}
    - {id: operating_arm, end_effector: left, capabilities: [grasp, lift, place, scoop, release]}
steps:
  - {id: place_boat, skill: place, actors: [operating_arm], parameters: {object: obj_weighing_boat, target_frame: obj_balance.weighing_pan}}
  - {id: press_tare, skill: press, actors: [auxiliary_arm], parameters: {object: obj_balance, target_frame: obj_balance.tare_button}, depends_on: [place_boat]}
  - {id: hold_bottle, skill: grasp_and_hold, actors: [auxiliary_arm], parameters: {object: obj_powder_bottle, grasp_frame: obj_powder_bottle.grasp}, depends_on: [press_tare]}
  - {id: pick_spoon, skill: lift, actors: [operating_arm], parameters: {object: obj_sampling_spoon, grasp_frame: obj_sampling_spoon.grasp}, depends_on: [hold_bottle]}
  - {id: scoop_sample, skill: scoop, actors: [operating_arm], parameters: {object: obj_sampling_spoon, object_frame: obj_sampling_spoon.bowl, target_frame: obj_powder_bottle.sample}, depends_on: [pick_spoon]}
  - {id: transfer_to_boat, skill: place, actors: [operating_arm], parameters: {object: obj_sampling_spoon, object_frame: obj_sampling_spoon.bowl, target_frame: obj_weighing_boat.interior}, depends_on: [scoop_sample]}
  - {id: return_spoon, skill: place, actors: [operating_arm], parameters: {object: obj_sampling_spoon, target_frame: table.support}, depends_on: [transfer_to_boat]}
invariants:
