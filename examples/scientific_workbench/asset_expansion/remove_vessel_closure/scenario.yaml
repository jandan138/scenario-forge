schema_version: scenario-spec/v0.7
scenario_id: scientific_workbench_remove_vessel_closure
domain: scientific_workbench
task_family: remove_vessel_closure
instruction: 辅助臂固定锥形瓶；操作臂抓住29/42磨口瓶塞，轻微扭转后向上取出，再把瓶塞放入桌面放置架。
scene:
  asset_id: scientific_environment_code_room_teaching_research_v2
  root_prim_path: /World
  pose: {xyz: [0.002882434, -0.0069055, 0.0], wxyz: [0.0, 0.0, 0.0, 1.0]}
objects:
  - id: table
    asset_id: scientific_workbench_ebench_table_static_support
    source_prim_path: /World/table
    role: table
    pose: {xyz: [0.0, 0.0, 0.0], wxyz: [1.0, 0.0, 0.0, 0.0]}
  - id: obj_flask
    asset_id: scientific_workbench_conical_flask_250ml_29_42_dynamic
