schema_version: scenario-spec/v0.7
scenario_id: scientific_workbench_insert_stir_bar_and_closure
domain: scientific_workbench
task_family: insert_stir_bar_and_closure
instruction: 辅助臂固定锥形瓶；操作臂拿起磁力搅拌子并放入瓶内，再拿起29/42磨口瓶塞，对准瓶口并插入闭合。
scene:
  asset_id: scientific_environment_code_room_example4_v2
  root_prim_path: /World
  pose: {xyz: [0.002882434, -0.0069055, 0.0], wxyz: [0.0, 0.0, 0.0, 1.0]}
objects:
  - id: table
    asset_id: scientific_workbench_ebench_table_static_support
    source_prim_path: /World/table
    role: table
    pose: {xyz: [0.0, 0.0, 0.0], wxyz: [1.0, 0.0, 0.0, 0.0]}
  - id: obj_flask
    asset_id: scientific_workbench_conical_flask_250ml_29_42_dynamic
    source_prim_path: /World/ConicalFlask2942
    role: target_container
    pose: {xyz: [-0.18, -0.14, 0.755], wxyz: [1.0, 0.0, 0.0, 0.0]}
    named_frames:
      grasp: {xyz: [0.0, 0.0, 0.075], wxyz: [1.0, 0.0, 0.0, 0.0]}
      opening: {xyz: [0.0, 0.0, 0.175], wxyz: [1.0, 0.0, 0.0, 0.0]}
      closure_seat: {xyz: [0.0, 0.0, 0.12814], wxyz: [1.0, 0.0, 0.0, 0.0]}
      interior_center: {xyz: [0.0, 0.0, 0.055], wxyz: [1.0, 0.0, 0.0, 0.0]}
  - id: obj_stir_bar
    asset_id: scientific_workbench_magnetic_stir_bar_dynamic
    source_prim_path: /World/MagneticStirBar
    role: stir_bar
    pose: {xyz: [-0.04, -0.12, 0.755], wxyz: [1.0, 0.0, 0.0, 0.0]}
    named_frames:
      support: {xyz: [0.0, 0.0, 0.0], wxyz: [1.0, 0.0, 0.0, 0.0]}
      grasp: {xyz: [0.0, 0.0, 0.004415], wxyz: [1.0, 0.0, 0.0, 0.0]}
  - id: obj_stopper
    asset_id: scientific_workbench_ground_glass_stopper_29_42_dynamic
    source_prim_path: /World/GroundGlassStopper2942
    role: vessel_closure
    pose: {xyz: [0.10, -0.12, 0.755], wxyz: [1.0, 0.0, 0.0, 0.0]}
    named_frames:
      joint_tip: {xyz: [0.0, 0.0, 0.0], wxyz: [1.0, 0.0, 0.0, 0.0]}
      joint_seat: {xyz: [0.0, 0.0, 0.04686], wxyz: [1.0, 0.0, 0.0, 0.0]}
      grasp: {xyz: [0.0, 0.0, 0.06918], wxyz: [1.0, 0.0, 0.0, 0.0]}
robot:
  profile_ref: manip/lift2/R5a_isaac41_vr600_v1
  spawn: {xyz: [0.0, -1.02, 0.31], wxyz: [0.7071067812, 0.0, 0.0, 0.7071067812]}
  actors:
    - {id: auxiliary_arm, end_effector: right, capabilities: [grasp, hold, release]}
    - {id: operating_arm, end_effector: left, capabilities: [grasp, lift, align, place, release]}
steps:
  - {id: hold_flask, skill: grasp_and_hold, actors: [auxiliary_arm], parameters: {object: obj_flask, grasp_frame: obj_flask.grasp}}
  - {id: pick_stir_bar, skill: lift, actors: [operating_arm], parameters: {object: obj_stir_bar, grasp_frame: obj_stir_bar.grasp}, depends_on: [hold_flask]}
  - {id: align_stir_bar, skill: align, actors: [operating_arm], parameters: {object: obj_stir_bar, target_frame: obj_flask.opening}, depends_on: [pick_stir_bar]}
  - {id: place_stir_bar_inside, skill: place, actors: [operating_arm], parameters: {object: obj_stir_bar, target_frame: obj_flask.interior_center, containment_region: obj_flask.interior_safe}, depends_on: [align_stir_bar]}
  - {id: pick_stopper, skill: lift, actors: [operating_arm], parameters: {object: obj_stopper, grasp_frame: obj_stopper.grasp}, depends_on: [place_stir_bar_inside]}
  - {id: align_stopper, skill: align, actors: [operating_arm], parameters: {source_frame: obj_stopper.joint_tip, target_frame: obj_flask.opening}, depends_on: [pick_stopper]}
  - {id: insert_stopper, skill: insert, actors: [operating_arm], parameters: {object: obj_stopper, source_frame: obj_stopper.joint_tip, target_frame: obj_flask.closure_seat}, depends_on: [align_stopper]}
invariants:
  - {id: flask_held_during_insert, type: maintain_grasp, actor: auxiliary_arm, object: obj_flask, from_step: hold_flask, through_step: insert_stopper}
success:
  operator: all
  claim_scope: semantic_task_contract_with_geometry_qualified_closure
  predicates:
    - {id: stir_bar_inside, type: relative_pose_reached, sequence_index: 0, parameters: {object: obj_stir_bar, relative_to: obj_flask, xyz_range: {x: [-0.029, 0.029], y: [-0.029, 0.029], z: [0.013, 0.091]}}}
    - {id: stopper_closed, type: relative_pose_reached, sequence_index: 1, parameters: {object: obj_stopper, relative_to: obj_flask, xyz_range: {x: [-0.015, 0.015], y: [-0.015, 0.015], z: [0.115, 0.14]}}}
  progress_rubric:
    aggregation: {type: weighted_progress_score, normalization: declared_sum, inactive_treatment: zero, primary_metric_id: stir_bar_inside}
    items:
      - {id: stir_bar_lifted, weight: 0.15, temporal: {kind: instant}, condition: {type: object_lifted, parameters: {object: obj_stir_bar, support_surface: table, min_clearance_m: 0.005, held_by: operating_arm}}, source_ref: {source_order: 4, item: 时序1}}
      - {id: stir_bar_aligned, weight: 0.15, temporal: {kind: instant}, condition: {type: relative_pose_reached, parameters: {object: obj_stir_bar, relative_to: obj_flask, containment_region: obj_flask.opening}}, source_ref: {source_order: 4, item: 时序2}}
      - {id: stir_bar_inside, weight: 0.15, temporal: {kind: instant}, condition: {type: relative_pose_reached, parameters: {object: obj_stir_bar, relative_to: obj_flask, containment_region: obj_flask.interior_safe}}, source_ref: {source_order: 4, item: 时序3}}
      - {id: closure_lifted, weight: 0.10, temporal: {kind: instant}, condition: {type: object_lifted, parameters: {object: obj_stopper, support_surface: table, min_clearance_m: 0.01, held_by: operating_arm}}, source_ref: {source_order: 4, item: 时序4}}
      - {id: closure_aligned, weight: 0.15, temporal: {kind: instant}, condition: {type: relative_pose_reached, parameters: {object: obj_stopper, relative_to: obj_flask, xyz_range: {x: [-0.02, 0.02], y: [-0.02, 0.02], z: [0.17, 0.35]}}}, source_ref: {source_order: 4, item: 时序5}}
      - {id: stir_bar_terminal_inside, weight: 0.10, temporal: {kind: terminal}, condition: {type: relative_pose_reached, parameters: {object: obj_stir_bar, relative_to: obj_flask, containment_region: obj_flask.interior_safe}}, source_ref: {source_order: 4, item: 终帧-磁子在容器内}}
      - {id: closure_terminal_closed, weight: 0.20, temporal: {kind: terminal}, condition: {type: relative_pose_reached, parameters: {object: obj_stopper, relative_to: obj_flask, xyz_range: {x: [-0.015, 0.015], y: [-0.015, 0.015], z: [0.115, 0.14]}}}, source_ref: {source_order: 4, item: 终帧-闭合}}
max_steps: 900
seed: "004"
