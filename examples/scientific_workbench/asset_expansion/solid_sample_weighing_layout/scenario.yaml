  progress_rubric:
    aggregation: {type: weighted_progress_score, normalization: declared_sum, inactive_treatment: zero, primary_metric_id: weighing_dish_on_pan}
    items:
      - {id: weighing_dish_on_pan, weight: 0.10, active: false, requires: [task_execution.dynamic_container_placement], temporal: {kind: instant}, condition: {type: relative_pose_reached, parameters: {object: obj_weighing_dish, relative_to: obj_balance}}, source_ref: {source_order: 15, item: 时序1}}
      - {id: tare_button_pressed, weight: 0.10, active: false, requires: [asset.balance.tare_button_interaction], temporal: {kind: instant}, condition: {type: motion_trajectory_completed, parameters: {object: obj_balance, trajectory: {kind: button_press, control: tare}}}, source_ref: {source_order: 15, item: 时序2}}
      - {id: spatula_lifted, weight: 0.10, active: false, requires: [asset.spatula.dynamic_interaction], temporal: {kind: instant}, condition: {type: object_lifted, parameters: {object: obj_micro_spatula, support_surface: table}}, source_ref: {source_order: 15, item: 时序3}}
      - {id: spatula_enters_sample, weight: 0.10, active: false, requires: [asset.reagent_bottle, asset.solid_sample], temporal: {kind: instant}, condition: {type: relative_pose_reached, parameters: {object: obj_micro_spatula, relative_to_role: reagent_bottle}}, source_ref: {source_order: 15, item: 时序4}}
      - {id: spatula_carries_sample, weight: 0.20, active: false, requires: [asset.reagent_bottle, asset.solid_sample, metric.sample_attachment], temporal: {kind: instant}, condition: {type: motion_trajectory_completed, parameters: {object: obj_micro_spatula, trajectory: {kind: scoop_and_carry}}}, source_ref: {source_order: 15, item: 时序5}}
      - {id: sample_in_weighing_dish, weight: 0.25, active: false, requires: [asset.solid_sample, metric.sample_containment], temporal: {kind: instant}, condition: {type: relative_pose_reached, parameters: {object_role: solid_sample, relative_to: obj_weighing_dish}}, source_ref: {source_order: 15, item: 时序6}}
      - {id: spatula_returned, weight: 0.05, active: false, requires: [asset.spatula.dynamic_interaction], temporal: {kind: terminal}, condition: {type: object_released_on_support, parameters: {object: obj_micro_spatula, support_surface: table}}, source_ref: {source_order: 15, item: 终帧-药匙归还}}
      - {id: weighing_dish_remains_on_pan, weight: 0.10, active: false, requires: [task_execution.dynamic_container_placement], temporal: {kind: terminal}, condition: {type: relative_pose_reached, parameters: {object: obj_weighing_dish, relative_to: obj_balance}}, source_ref: {source_order: 15, item: 终帧-容器在称量区}}
max_steps: 600
seed: "015"
